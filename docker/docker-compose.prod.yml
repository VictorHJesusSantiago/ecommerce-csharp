version: '3.8'

services:
  api:
    image: ecommerce-api:latest
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - frontend
      - backend

  web:
    image: ecommerce-web:latest
    deploy:
      replicas: 2
    restart: always
    networks:
      - frontend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    deploy:
      placement:
        constraints:
          - node.labels.db == true
    volumes:
      - sqlserver-prod:/var/opt/mssql
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-prod:/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - frontend

volumes:
  sqlserver-prod:
  redis-prod:

networks:
  frontend:
  backend:
