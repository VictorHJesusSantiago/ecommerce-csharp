apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  db-connection-string: "Host=postgres;Database=ecommerce;Username=ecommerce_user;Password=change_me_in_production"
  jwt-secret-key: "your-super-secret-key-at-least-32-characters-long"
  redis-connection-string: "redis:6379,password=change_me"
  redis-password: "change_me"
  postgres-user: "ecommerce_user"
  postgres-password: "change_me"
  rabbitmq-user: "guest"
  rabbitmq-password: "change_me"
