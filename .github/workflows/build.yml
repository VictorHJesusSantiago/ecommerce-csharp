name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore src/Ecommerce.Api/Ecommerce.Api.csproj
        dotnet restore src/Ecommerce.Web/Ecommerce.Web.csproj
        dotnet restore tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj
        dotnet restore tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj
        dotnet restore tests/Ecommerce.ArchitectureTests/Ecommerce.ArchitectureTests.csproj

    - name: Build API and Web
      run: |
        dotnet build src/Ecommerce.Api/Ecommerce.Api.csproj --no-restore --configuration Release
        dotnet build src/Ecommerce.Web/Ecommerce.Web.csproj --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run Integration Tests
      run: dotnet test tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

    - name: Run Architecture Tests
      run: dotnet test tests/Ecommerce.ArchitectureTests/Ecommerce.ArchitectureTests.csproj --no-restore --configuration Release --verbosity normal

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker API
      run: docker build -f docker/Dockerfile -t ecommerce-api:${{ github.sha }} .

    - name: Build Docker Web
      run: docker build -f docker/Dockerfile.Web -t ecommerce-web:${{ github.sha }} .

  code-analysis:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore src/Ecommerce.Api/Ecommerce.Api.csproj
        dotnet restore src/Ecommerce.Web/Ecommerce.Web.csproj
        dotnet restore tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj
        dotnet restore tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj
        dotnet restore tests/Ecommerce.ArchitectureTests/Ecommerce.ArchitectureTests.csproj

    - name: Run dotnet format check
      run: |
        dotnet format src/Ecommerce.Api/Ecommerce.Api.csproj --verify-no-changes --no-restore --verbosity diagnostic
        dotnet format src/Ecommerce.Web/Ecommerce.Web.csproj --verify-no-changes --no-restore --verbosity diagnostic
        dotnet format tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj --verify-no-changes --no-restore --verbosity diagnostic
        dotnet format tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj --verify-no-changes --no-restore --verbosity diagnostic
        dotnet format tests/Ecommerce.ArchitectureTests/Ecommerce.ArchitectureTests.csproj --verify-no-changes --no-restore --verbosity diagnostic

    - name: Run security analysis
      shell: bash
      run: |
        set -euo pipefail
        projects=(
          src/Ecommerce.Api/Ecommerce.Api.csproj
          src/Ecommerce.Web/Ecommerce.Web.csproj
          tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj
          tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj
          tests/Ecommerce.ArchitectureTests/Ecommerce.ArchitectureTests.csproj
        )
        for project in "${projects[@]}"; do
          output="$(dotnet list "$project" package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -E "has the following vulnerable packages|^   > "; then
            echo "Vulnerable package detected in $project"
            exit 1
          fi
        done

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
