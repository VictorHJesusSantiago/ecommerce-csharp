name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/Ecommerce.UnitTests --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run Integration Tests
      run: dotnet test tests/Ecommerce.IntegrationTests --no-build --configuration Release --verbosity normal

    - name: Run Architecture Tests
      run: dotnet test tests/Ecommerce.ArchitectureTests --no-build --configuration Release --verbosity normal

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker API
      run: docker build -f docker/Dockerfile.api -t ecommerce-api:${{ github.sha }} .

    - name: Build Docker Web
      run: docker build -f docker/Dockerfile.web -t ecommerce-web:${{ github.sha }} .

  code-analysis:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run dotnet format check
      run: dotnet format --verify-no-changes --verbosity diagnostic
      continue-on-error: true

    - name: Run security analysis
      run: dotnet list package --vulnerable --include-transitive
      continue-on-error: true

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
